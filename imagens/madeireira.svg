<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
  <defs>
    <linearGradient id="md-parede" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a4a"/>
      <stop offset="1" stop-color="#6b4e34"/>
    </linearGradient>
    <linearGradient id="md-telhado" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4130"/>
      <stop offset="1" stop-color="#40291d"/>
    </linearGradient>
    <radialGradient id="md-tronco" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d8a86a"/>
      <stop offset="0.7" stop-color="#a9764a"/>
      <stop offset="1" stop-color="#7c5334"/>
    </radialGradient>
  </defs>

  <!-- galpão de serragem, ao fundo à direita -->
  <path d="M300 200 L300 340 L470 340 L470 200 L385 150 Z" fill="url(#md-parede)"/>
  <path d="M292 202 L385 142 L478 202 L455 208 L385 166 L315 208 Z" fill="url(#md-telhado)"/>
  <rect x="380" y="260" width="46" height="80" fill="#2e2019"/>
  <rect x="320" y="230" width="30" height="26" fill="#c9b79a" opacity="0.85"/>

  <!-- serra circular apoiada na parede do galpão -->
  <circle cx="440" cy="250" r="26" fill="none" stroke="#d99a35" stroke-width="4"/>
  <circle cx="440" cy="250" r="26" fill="none" stroke="#3a2a1c" stroke-width="9" stroke-dasharray="4 6"/>
  <circle cx="440" cy="250" r="6" fill="#efe8d6"/>

  <!-- pilha de troncos cortados, em primeiro plano -->
  <g>
    <ellipse cx="90" cy="330" rx="86" ry="16" fill="#20140d" opacity="0.35"/>
    <g stroke="#5c3f26" stroke-width="3">
      <circle cx="60" cy="300" r="34" fill="url(#md-tronco)"/>
      <circle cx="128" cy="300" r="34" fill="url(#md-tronco)"/>
      <circle cx="94" cy="266" r="34" fill="url(#md-tronco)"/>
      <circle cx="30" cy="266" r="30" fill="url(#md-tronco)"/>
      <circle cx="158" cy="266" r="30" fill="url(#md-tronco)"/>
    </g>
    <!-- anéis de crescimento nos topos visíveis -->
    <g fill="none" stroke="#8a5d34" stroke-width="2" opacity="0.7">
      <circle cx="94" cy="266" r="20"/>
      <circle cx="94" cy="266" r="11"/>
      <circle cx="30" cy="266" r="17"/>
      <circle cx="158" cy="266" r="17"/>
    </g>
  </g>

  <!-- machado cravado num dos troncos, detalhe -->
  <g transform="translate(150,236) rotate(18)">
    <rect x="-3" y="0" width="6" height="46" fill="#5c4130"/>
    <path d="M-4 0 L-24 -14 L-20 6 L-4 10 Z" fill="#c9c9c9" stroke="#5a5a5a" stroke-width="2"/>
  </g>
</svg>

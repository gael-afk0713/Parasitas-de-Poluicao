<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320">
  <defs>
    <radialGradient id="et-tanque" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#bfe4ec"/>
      <stop offset="0.6" stop-color="#7fbccb"/>
      <stop offset="1" stop-color="#4c8a99"/>
    </radialGradient>
    <linearGradient id="et-borda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf7fa"/>
      <stop offset="1" stop-color="#a9c9d1"/>
    </linearGradient>
    <linearGradient id="et-casa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a95a6"/>
      <stop offset="1" stop-color="#3f7383"/>
    </linearGradient>
  </defs>

  <!-- casa de controle ao fundo -->
  <path d="M300 150 L300 230 L420 230 L420 150 L360 122 Z" fill="url(#et-casa)"/>
  <path d="M294 152 L360 116 L426 152 L406 158 L360 134 L314 158 Z" fill="#2c4750"/>
  <rect x="352" y="188" width="26" height="42" fill="#1c2f35"/>
  <rect x="316" y="168" width="20" height="16" fill="#cdeaf0" opacity="0.85"/>

  <!-- dois tanques circulares de decantação, vistos de cima em perspectiva isométrica -->
  <g>
    <ellipse cx="110" cy="220" rx="98" ry="46" fill="url(#et-borda)" stroke="#5f97a6" stroke-width="4"/>
    <ellipse cx="110" cy="216" rx="80" ry="36" fill="url(#et-tanque)"/>
    <ellipse cx="110" cy="216" rx="46" ry="20" fill="none" stroke="#eaf7fa" stroke-width="2" opacity="0.5"/>
    <!-- braço giratório do decantador -->
    <path d="M110 216 L182 200" stroke="#2c4750" stroke-width="4"/>
    <circle cx="110" cy="216" r="6" fill="#2c4750"/>
  </g>
  <g>
    <ellipse cx="210" cy="270" rx="70" ry="32" fill="url(#et-borda)" stroke="#5f97a6" stroke-width="4"/>
    <ellipse cx="210" cy="267" rx="56" ry="24" fill="url(#et-tanque)"/>
    <path d="M210 267 L258 254" stroke="#2c4750" stroke-width="3"/>
    <circle cx="210" cy="267" r="5" fill="#2c4750"/>
  </g>

  <!-- canos ligando os tanques à casa de controle -->
  <path d="M196 214 L300 194" stroke="#2c4750" stroke-width="8" fill="none"/>
  <path d="M270 262 L320 226" stroke="#2c4750" stroke-width="7" fill="none"/>

  <!-- bolhas de aeração, reforça "água limpa" -->
  <g fill="#eaf7fa" opacity="0.7">
    <circle cx="90" cy="200" r="4"/>
    <circle cx="130" cy="192" r="3"/>
    <circle cx="70" cy="210" r="2.5"/>
  </g>
</svg>

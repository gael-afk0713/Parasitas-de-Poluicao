<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <defs>
    <linearGradient id="rf-torre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a969c"/>
      <stop offset="0.5" stop-color="#5c6a70"/>
      <stop offset="1" stop-color="#3c464a"/>
    </linearGradient>
    <linearGradient id="rf-tanque" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9b98a"/>
      <stop offset="0.5" stop-color="#a3915f"/>
      <stop offset="1" stop-color="#7c6c46"/>
    </linearGradient>
    <linearGradient id="rf-chama" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d99a35"/>
      <stop offset="1" stop-color="#efe8d6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- base industrial, ocupa as 3 células -->
  <rect x="20" y="360" width="720" height="60" fill="#2a2622"/>
  <rect x="20" y="352" width="720" height="10" fill="#413a32"/>

  <!-- tanque de armazenamento à esquerda -->
  <g>
    <ellipse cx="110" cy="300" rx="86" ry="20" fill="url(#rf-tanque)" stroke="#5f5138" stroke-width="3"/>
    <rect x="24" y="300" width="172" height="60" fill="url(#rf-tanque)" stroke="#5f5138" stroke-width="3"/>
    <ellipse cx="110" cy="360" rx="86" ry="20" fill="#7c6c46" stroke="#5f5138" stroke-width="3"/>
    <rect x="24" y="322" width="172" height="10" fill="#8a4a2f" opacity="0.85"/>
  </g>

  <!-- duas colunas de destilação centrais -->
  <g>
    <rect x="330" y="90" width="46" height="270" rx="6" fill="url(#rf-torre)" stroke="#2c3437" stroke-width="3"/>
    <rect x="410" y="130" width="38" height="230" rx="6" fill="url(#rf-torre)" stroke="#2c3437" stroke-width="3"/>
    <ellipse cx="353" cy="90" rx="23" ry="10" fill="#a8b4b8"/>
    <ellipse cx="429" cy="130" rx="19" ry="8" fill="#a8b4b8"/>
    <!-- anéis das colunas -->
    <g stroke="#2c3437" stroke-width="2" opacity="0.6">
      <path d="M330 160h46M330 210h46M330 260h46M330 310h46"/>
      <path d="M410 190h38M410 240h38M410 290h38M410 330h38"/>
    </g>
    <!-- chama de flare no topo da coluna maior -->
    <path d="M353 88 C346 70 360 62 353 46 C368 58 366 76 358 88 Z" fill="url(#rf-chama)"/>
  </g>

  <!-- tubulação conectando tanque às colunas -->
  <path d="M196 320 L330 320" stroke="#3c464a" stroke-width="10" fill="none"/>
  <path d="M376 260 L410 260" stroke="#3c464a" stroke-width="8" fill="none"/>

  <!-- estrutura treliçada à direita, dá volume à composição -->
  <g stroke="#5c6a70" stroke-width="5" fill="none">
    <path d="M500 360 L500 150 L640 150 L640 360"/>
    <path d="M500 220 L640 220 M500 290 L640 290"/>
    <path d="M500 150 L640 220 M640 150 L500 220 M500 220 L640 290 M640 220 L500 290"/>
  </g>
  <circle cx="570" cy="150" r="10" fill="#8a4a2f"/>
</svg>

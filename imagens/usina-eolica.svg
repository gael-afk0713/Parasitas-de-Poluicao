<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440">
  <defs>
    <linearGradient id="eo-torre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2fbfd"/>
      <stop offset="0.5" stop-color="#dbeaee"/>
      <stop offset="1" stop-color="#a9bcc2"/>
    </linearGradient>
    <linearGradient id="eo-pa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d6da"/>
    </linearGradient>
  </defs>

  <!-- torre afunilada -->
  <path d="M152 440 L168 440 L177 120 L143 120 Z" fill="url(#eo-torre)" stroke="#8fa3a9" stroke-width="2"/>

  <!-- nacele (cabine no topo da torre) -->
  <rect x="132" y="104" width="56" height="26" rx="8" fill="#dbeaee" stroke="#8fa3a9" stroke-width="2"/>

  <!-- 3 pás partindo do cubo, giradas em ângulos diferentes -->
  <g transform="translate(160,117)">
    <circle r="7" fill="#c7d6da" stroke="#8fa3a9" stroke-width="2"/>
    <g fill="url(#eo-pa)" stroke="#8fa3a9" stroke-width="2">
      <path d="M0 0 C 10 -18, 8 -70, 0 -96 C -8 -70, -10 -18, 0 0 Z" transform="rotate(0)"/>
      <path d="M0 0 C 10 -18, 8 -70, 0 -96 C -8 -70, -10 -18, 0 0 Z" transform="rotate(120)"/>
      <path d="M0 0 C 10 -18, 8 -70, 0 -96 C -8 -70, -10 -18, 0 0 Z" transform="rotate(240)"/>
    </g>
  </g>

  <!-- linhas sutis de "vento", reforça o tema -->
  <g stroke="#a9bcc2" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M40 60 h60"/>
    <path d="M30 84 h44"/>
    <path d="M250 40 h50"/>
    <path d="M258 66 h34"/>
  </g>
</svg>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de parallax</title>
<style>
  :root { --fundo: #0c0c0e; --texto: #e8e4da; --apagado: #8a8678; --linha: #2a2a2e; --ativo: #48d9a8; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  canvas { width: 100%; image-rendering: pixelated; display: block; border-radius: 4px; }
  .barra { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; align-items: center; }
  button { background: transparent; color: var(--texto); border: 1px solid var(--linha); border-radius: 4px;
           padding: 6px 12px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--ativo); color: var(--ativo); }
  p { color: var(--apagado); margin: 4px 0; }
</style></head><body><main>
<canvas id="tela" width="320" height="180"></canvas>
<div class="barra" id="areas"></div>
<div class="barra" id="estados"></div>
<div class="barra"><button id="auto" aria-pressed="true">Andar sozinho</button></div>
<p>Setas ou A/D movem o personagem. Velocidade de cada camada em relação ao chão:
camada 4 (longe) 10%, camada 3 22%, camada 2 38%, camada 1 (perto) 58%, chão 100%.</p>
</main>
<script>
const CEUS = {"raizes": {"p": ["#1b2430", "#7d8896"], "r": ["#0d2a38", "#c2b784"]}, "varzea": {"p": ["#16242a", "#8d8b5e"], "r": ["#0e2740", "#dcb888"]}, "clareira": {"p": ["#1b1620", "#a05a20"], "r": ["#12283a", "#e2c890"]}, "dossel": {"p": ["#232830", "#98a0aa"], "r": ["#10283c", "#f0d494"]}, "coracao": {"p": ["#17102a", "#6e2ea8"], "r": ["#2a3a6a", "#f7cdb2"]}};
const NOMES = {"raizes": "Raízes", "varzea": "Várzea", "clareira": "Clareira", "dossel": "Dossel", "coracao": "Coração"};
const VEL = [0.58, 0.38, 0.22, 0.10];      // camada 1..4
const W = 320, H = 180, CW = 32, SUP = 16, CHAO_Y = 126;   // linha do chão na tela
const tela = document.getElementById('tela'), ctx = tela.getContext('2d');
ctx.imageSmoothingEnabled = false;
let area = 'raizes', estado = 'p', camX = 0, x = 0, auto = true, dir = 1, andando = false;
const guard = { img: new Image(), meta: null };
guard.img.src = '../guardiao/guardiao.png';
fetch('../guardiao/guardiao.json').then(r => r.json()).then(m => guard.meta = m);
const teclas = {};
const cache = {};
function img(src) {
  if (!cache[src]) { const i = new Image(); i.src = src; cache[src] = i; }
  return cache[src];
}
const nomeE = () => estado === 'p' ? 'poluida' : 'restaurada';
const nomeC = () => estado === 'p' ? 'poluido' : 'restaurado';
const sorteio = (i, s) => { let h = (i * 374761393 + s * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) % 3; };

function desenhar() {
  const [topo, base] = CEUS[area][estado];
  const g = ctx.createLinearGradient(0, 0, 0, CHAO_Y + 20);
  g.addColorStop(0, topo); g.addColorStop(1, base);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let c = 4; c >= 1; c--) {
    const im = img(`../${area}/montanhas/camada-${c}-${nomeE()}.png`);
    if (!im.complete || !im.width) continue;
    const off = Math.floor(camX * VEL[c - 1]) % im.width;
    const y = CHAO_Y + 12 - im.height;
    for (let k = -1; k * im.width - off < W; k++) ctx.drawImage(im, k * im.width - off, y);
  }
  // chão: pedaços de meio sorteados por índice, preenchimento embaixo
  const i0 = Math.floor(camX / CW) - 1;
  for (let i = i0; i < i0 + W / CW + 3; i++) {
    const sx = i * CW - Math.floor(camX);
    const meio = img(`../${area}/chao/meio-${sorteio(i, 1) + 1}-${nomeC()}.png`);
    const fill = img(`../${area}/chao/preenchimento-${sorteio(i, 2) + 1}-${nomeC()}.png`);
    if (meio.complete) ctx.drawImage(meio, sx, CHAO_Y - SUP);
    if (fill.complete) ctx.drawImage(fill, sx, CHAO_Y - SUP + 48);
  }
  // Guardião em pixel art: parado ou correndo, virando pro lado do movimento
  if (guard.meta && guard.img.complete) {
    const S = guard.meta.celula, an = guard.meta.animacoes[andando ? 'correndo' : 'parado'];
    const i = Math.floor(performance.now() / 1000 * an.fps) % an.quadros;
    const px = Math.floor(x - camX), py = CHAO_Y;
    ctx.save(); ctx.translate(px, py - guard.meta.pivo[1] - 1);
    if (dir < 0) { ctx.scale(-1, 1); }
    ctx.drawImage(guard.img, i * S, an.linha * S, S, S, -guard.meta.pivo[0], 0, S, S);
    ctx.restore();
  }
}
let antes = performance.now();
function quadro(t) {
  const dt = Math.min(0.05, (t - antes) / 1000); antes = t;
  let v = 0;
  if (teclas.ArrowRight || teclas.d) v = 1; else if (teclas.ArrowLeft || teclas.a) v = -1; else if (auto) v = 1;
  if (v) dir = v;
  andando = v !== 0;
  x += v * 60 * dt;
  camX += (x - W / 2 - camX) * Math.min(1, dt * 6);
  desenhar();
  requestAnimationFrame(quadro);
}
addEventListener('keydown', e => { teclas[e.key] = true; if (e.key.startsWith('Arrow') || 'ad'.includes(e.key)) auto = false, sinc(); });
addEventListener('keyup', e => { teclas[e.key] = false; });
function botoes(id, itens, atual, aoEscolher) {
  const el = document.getElementById(id); el.innerHTML = '';
  for (const [v, rot] of itens) {
    const b = document.createElement('button'); b.textContent = rot;
    b.setAttribute('aria-pressed', v === atual()); b.onclick = () => { aoEscolher(v); sinc(); };
    el.appendChild(b);
  }
}
function sinc() {
  botoes('areas', Object.entries(NOMES), () => area, v => area = v);
  botoes('estados', [['p', 'Poluída'], ['r', 'Restaurada']], () => estado, v => estado = v);
  document.getElementById('auto').setAttribute('aria-pressed', auto);
}
document.getElementById('auto').onclick = () => { auto = !auto; sinc(); };
sinc();
requestAnimationFrame(quadro);
window.__parallax = { get camX() { return camX; }, set: (a, e) => { area = a; estado = e; sinc(); }, desenhar };
</script></body></html>

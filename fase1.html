<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fase 1 · Parasitas de Poluição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="fase1-body">

  <div class="fase1-bg" aria-hidden="true"></div>
  <canvas id="grid-fase1" class="fase1-grid"></canvas>

  <div class="boas-vindas" id="boas-vindas" aria-hidden="true"></div>

  <header class="hud-fase1">
    <div class="hud-stat hud-stat--empresa">
      <span class="hud-stat-rotulo">Empresa</span>
      <span class="hud-stat-valor" id="hud-empresa">—</span>
    </div>
    <div class="hud-stat">
      <span class="hud-stat-rotulo">Caixa</span>
      <span class="hud-stat-valor" id="hud-dinheiro">R$ 50.000</span>
    </div>
    <div class="hud-stat hud-stat--fabrica">
      <svg class="icone-fabrica hud-fabrica-icone" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 21V13l4 3v-3l4 3v-3l4 3v5H3Z"/>
        <rect x="17" y="7" width="3" height="14"/>
        <path d="M2 21h20"/>
      </svg>
      <div class="hud-stat-texto">
        <span class="hud-stat-rotulo">Fábricas</span>
        <span class="hud-stat-valor" id="hud-fabricas">1</span>
      </div>
    </div>
  </header>

  <button class="botao-fabricas" id="btn-fabricas" aria-expanded="false" aria-controls="painel-fabricas">
    <svg class="icone-fabrica" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 21V13l4 3v-3l4 3v-3l4 3v5H3Z"/>
      <rect x="17" y="7" width="3" height="14"/>
      <path d="M2 21h20"/>
    </svg>
    Fábricas
  </button>

  <section class="painel-fabricas" id="painel-fabricas" aria-hidden="true">
    <div class="painel-fabricas-conteudo">
      <div class="painel-fabricas-cabecalho">
        <p class="painel-rotulo">Construção</p>
        <button class="painel-fabricas-fechar" id="fechar-fabricas" aria-label="Fechar">✕</button>
      </div>

      <div class="lista-fabricas">
        <button class="carta-fabrica" data-fabrica="usina-carvao">
          <svg class="icone-fabrica" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 21V13l4 3v-3l4 3v-3l4 3v5H3Z"/>
            <rect x="17" y="7" width="3" height="14"/>
            <path d="M2 21h20"/>
          </svg>
          <span class="carta-fabrica-texto">
            <span class="carta-fabrica-nome">Usina de Carvão</span>
            <span class="carta-fabrica-desc">Energia barata, alto custo ambiental.</span>
          </span>
          <span class="carta-fabrica-custo">R$ 8.000</span>
        </button>
      </div>
    </div>
  </section>

<script src="fase1.js"></script>
</body>
</html>
